name: CD Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: capstoneprojectresourcegroup
  LOCATION: centralindia

jobs:
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Azure Client ID
        shell: bash
        run: |
          if [ "${{ secrets.AZURE_CLIENT_ID }}" = "c1c5b6da-492d-40d1-bf5e-1b25d42e85e5" ]; then
            echo "AZURE_CLIENT_ID = MATCH"
          else
            echo "AZURE_CLIENT_ID = MISMATCH"
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep

      - name: Infrastructure What-If
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

  deploy-prod:
    name: Production Approval
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Production deployment placeholder
        run: |
          echo "Production deployment approved."
